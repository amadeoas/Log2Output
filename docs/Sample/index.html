<!doctype html>
<html>
  <head>
    <title>Draw data!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="text/javascript" src="draw.js"></script>
    <style>
    	div#menu {
  			height: 20px;
  			width: 174px;
  			float: right;
		}

		canvas { 
			height: 100vh; 
			width: 100vw; 
			overflow: auto;
		}

		.grid {
			color: #F0F8FF;
		}

		/* The switch - the box around the slider */
		.switch {
  			position: relative;
  			display: inline-block;
  			width: 74px;
  			height: 22px;
  			top: 6px;
		}

		.switch input {
			display:none;
		}

		.slider {
  			position: absolute;
  			cursor: pointer;
  			top: 0;
  			left: 0;
  			right: 0;
  			bottom: 0;
  			background-color: #D3D3D3;
  			-webkit-transition: .4s;
  			transition: .4s;
		}

		.slider:before {
  			position: absolute;
  			content: "";
  			height: 20px;
  			width: 20px;
  			left: 2px;
  			bottom: 1px;
  			background-color: white;
  			-webkit-transition: .4s;
  			transition: .4s;
		}

		input:checked + .slider {
  			background-color: #D3D3D3;
		}

		input:focus + .slider {
  			box-shadow: 0 0 1px #D3D3D3;
		}

		input:checked + .slider:before {
  			-webkit-transform: translateX(50px);
  			-ms-transform: translateX(50px);
  			transform: translateX(50px);
		}

		.on {
  			display: none;
		}

		.off {
  			text-decoration: line-through;
		}

		.on, .off {
  			color: #000000;
  			position: absolute;
  			transform: translate(-50%, -50%);
  			top: 50%;
  			left: 50%;
  			font-size: 10px;
  			font-family: Verdana, sans-serif;
		}

		input:checked+ .slider .on {
  			display: block;
		}

		input:checked + .slider .off {
  			display: none;
		}

		/* Rounded sliders */
		.slider.round {
  			border-radius: 20px;
		}

		.slider.round:before {
  			border-radius: 50%;
		}
    </style>
  </head>
  <body onload="init()">
		<div id="finput"><input type="file" id="fInputData"></div>
		<div id="view" style="width: 100%; height: 100%;" hidden>
			<div id="menu" style="height: 28px;">
				<button id="zoomDown" title="Zoom down" class="btn" onclick="zoomItDown()"><i class="fa fa-search-minus"></i></button>
				<button id="zoomUp" title="Zoom up" class="btn" onclick="zoomItUp()"><i class="fa fa-search-plus"></i></button>

				<!-- Rounded switch -->
				<label id="grid" class="switch" onclick="switchIt()">
 					<input type="checkbox" id="togBtn">
 					<div class="slider round">
						<!--ADDED HTML -->
						<span id="switchOn" class="on">GRID</span>
						<span id="switchOff" class="off">GRID</span>
						<!--END-->
					</div>
				</label>
				<button id="CloseView" title="Close View" class="btn" onclick="closeView()"><i class="fa fa-times-circle-o"></i></button>
			</div>
			<div id="pDraws" style="width: 100vw; height: 100vh; overflow: scroll;">
				<canvas id="draws"></canvas>
			</div>
		</div>
  </body>
</html>
